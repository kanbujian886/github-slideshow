name: Build Exchange Calculator APK

on:
  push:
    branches: [ exchange-calculator-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-calculator-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore and verify screenshot template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          src = Path("app/src/main/assets/template.b64")
          out = Path("app/src/main/assets/template.webp")

          # The historical text asset is missing one 78-byte run at byte 3280.
          # Restore it deterministically so every future build gets the exact,
          # already-validated reference image.
          data = base64.b64decode(src.read_text().strip(), validate=True)
          missing = base64.b64decode("aIrH2iKx9oisfaIrH2iKx9oisfaIrH2iKx9oisfaIrH2iKx9oisfaIrH2iKx9oisfaIrH2iKx9oisfaIrH2iKx9oisfaIrH2iKx9oisf")
          assert len(data) == 35510, f"unexpected source template length: {len(data)}"
          assert len(missing) == 78
          data = data[:3280] + missing + data[3280:]

          expected = "0b51af7984a45a0d42d5895390b5172e6df555b363f00e3ca40a5055a7651e21"
          actual = hashlib.sha256(data).hexdigest()
          assert len(data) == 35588, f"template length regression: {len(data)}"
          assert actual == expected, f"template hash regression: {actual}"
          assert data[:4] == b"RIFF" and data[8:12] == b"WEBP"

          out.write_bytes(data)
          print("template.webp bytes:", len(data))
          print("template.webp sha256:", actual)
          PY
          file app/src/main/assets/template.webp
      - name: Regression-check UI logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("app/src/main/assets/index.html").read_text()
          required = [
              'background-image:url("template.webp")',
              '编辑汇率',
              'id="inDealRate"',
              'id="inMarketRate"',
              'function normalizeRate',
              'if(x>=100 && x<1000) x=x/100;'
          ]
          for item in required:
              assert item in html, f"UI regression, missing: {item}"

          # Known case from device testing:
          # 1000 JPY, deal 4.3808, market typed as 441.2 => 4.412.
          jpy = 1000
          deal = 4.3808
          raw_market = 441.2
          market = raw_market / 100 if 100 <= raw_market < 1000 else raw_market
          cny = round(jpy * deal / 100, 2)
          market_cny = round(jpy * market / 100, 2)
          saving = round(market_cny - cny, 2)
          assert (cny, market_cny, saving) == (43.81, 44.12, 0.31)
          print("logic regression case:", cny, market_cny, saving)
          PY
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug
      - name: Verify final APK regression invariants
        run: |
          python3 - <<'PY'
          import zipfile, hashlib
          apk="app/build/outputs/apk/debug/app-debug.apk"
          expected = "0b51af7984a45a0d42d5895390b5172e6df555b363f00e3ca40a5055a7651e21"
          with zipfile.ZipFile(apk) as z:
              names=set(z.namelist())
              assert "assets/template.webp" in names
              assert "assets/index.html" in names
              data=z.read("assets/template.webp")
              html=z.read("assets/index.html").decode("utf-8")
              assert len(data) == 35588
              assert hashlib.sha256(data).hexdigest() == expected
              assert 'background-image:url("template.webp")' in html
              assert 'function normalizeRate' in html
              assert 'id="inDealRate"' in html and 'id="inMarketRate"' in html
              assert z.getinfo("resources.arsc").compress_type == zipfile.ZIP_STORED
              print("final APK template verified:", len(data), expected)
          PY
          /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          java -jar /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar verify -v app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-calculator-apk
          path: exchange-calculator-apk/app/build/outputs/apk/debug/app-debug.apk

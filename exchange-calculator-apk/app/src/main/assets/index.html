<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>汇率计算器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f0f3f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}
#screen{position:relative;width:100vw;height:100vh;overflow:hidden;background-color:#f0f3f8;background-image:url("template.webp");background-repeat:no-repeat;background-position:top center;background-size:100% 101.926%}
.cover{position:absolute;pointer-events:none}
.cover.jpy{left:67.0%;top:17.19%;width:28.4%;height:4.95%;background:#fff}
.cover.cny{left:59.24%;top:26.75%;width:36.1%;height:4.88%;background:#fff}
.cover.rate{left:59.38%;top:33.91%;width:26.9%;height:2.75%;background:#f4f6fa}
.amount{position:absolute;color:#303033;text-align:right;font-family:"AlipayNumber","Alibaba Sans 102","DIN Alternate","Helvetica Neue",Arial,sans-serif;font-weight:500;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.028em;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#jpy{right:6.5%;top:17.55%;width:41%;font-size:7.55vw}
#cny{right:6.5%;top:26.65%;width:48%;font-size:7.55vw}
.rate-dyn{position:absolute;right:13.6%;top:34.02%;height:2.7%;display:flex;align-items:center;justify-content:flex-end;gap:.16em;font-size:2.58vw;white-space:nowrap;color:#3a3c41;pointer-events:none}
#market{color:#777b84;text-decoration:line-through;text-decoration-thickness:1px}
#saving{color:#ef684d;font-weight:600}
.secret{position:absolute;right:8.6%;top:1.3%;width:15.2%;height:6.8%;border:0;background:transparent;padding:0}
.disclaimer{position:absolute;left:0;right:0;bottom:1.4%;text-align:center;color:#747981;font-size:10px;line-height:1;letter-spacing:.04em;pointer-events:none}
.mask{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(20,24,34,.42);z-index:100}
.mask.open{display:flex}
.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 32px rgba(0,0,0,.18)}
.handle{width:44px;height:5px;border-radius:99px;background:#d5d8de;margin:0 auto 10px}
h2{font-size:20px;margin:0 0 16px;color:#222}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-size:13px;color:#606672}
.field input{width:100%;height:48px;border:1px solid #dfe3e9;border-radius:12px;padding:0 12px;font-size:18px;outline:none;background:#fff}
.field input:focus{border-color:#4b8fff;box-shadow:0 0 0 3px rgba(75,143,255,.12)}
.derived{min-height:42px;font-size:12px;line-height:1.55;color:#747a84;margin:0 2px 12px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.actions button{height:48px;border:0;border-radius:13px;font-size:14px;font-weight:600}
.reset{background:#f1f3f6;color:#4c5159}
.preview{background:#eaf2ff;color:#1677ff}
.save{background:#1677ff;color:#fff}
.note{font-size:11px;color:#969ca5;line-height:1.5;margin-top:10px}
.err{color:#d94d45!important}
</style>
</head>
<body>
<div id="screen">
  <div class="cover jpy"></div>
  <div class="cover cny"></div>
  <div class="cover rate"></div>
  <div id="jpy" class="amount"></div>
  <div id="cny" class="amount"></div>
  <div class="rate-dyn"><span id="market"></span><span>省</span><span id="saving"></span><span>元</span></div>
  <button id="secret" class="secret" aria-label="menu"></button>
  <div class="disclaimer">非官方</div>
</div>

<div id="mask" class="mask">
  <div class="sheet">
    <div class="handle"></div>
    <h2>编辑展示数据</h2>
    <div class="field"><label>日元金额 JPY</label><input id="inJpy" inputmode="numeric"></div>
    <div class="field"><label>人民币金额 CNY</label><input id="inCny" inputmode="decimal"></div>
    <div class="field"><label>节省金额</label><input id="inSaving" inputmode="decimal"></div>
    <div id="derived" class="derived"></div>
    <div class="actions">
      <button id="reset" class="reset">恢复默认</button>
      <button id="preview" class="preview">预览</button>
      <button id="save" class="save">保存</button>
    </div>
    <div class="note">预览不会覆盖上一次正式保存的数据；保存后下次打开继续显示本次结果。</div>
  </div>
</div>

<script>
(()=>{
const KEY='exchange_demo_v3';
const DEF={jpy:852192,cny:36672.38,saving:253.10};
let saved=load();
let working={...saved};
const $=id=>document.getElementById(id);
const fmtJ=n=>Math.round(n).toLocaleString('en-US');
const fmtM=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const round2=n=>Math.round(n*100)/100;

function valid(x){
  return x && Number.isFinite(+x.jpy) && +x.jpy>=1 && +x.jpy<=4000000
    && Number.isFinite(+x.cny) && +x.cny>=0
    && Number.isFinite(+x.saving) && +x.saving>0;
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');
    if(valid(x)) return x;
  }catch(e){}
  return {...DEF};
}
function fit(el,start,min){
  el.style.fontSize=start+'vw';
  let size=start;
  while(el.scrollWidth>el.clientWidth && size>min){
    size-=.12;
    el.style.fontSize=size+'vw';
  }
}
function render(){
  $('jpy').textContent=fmtJ(working.jpy);
  $('cny').textContent=fmtM(working.cny);
  $('market').textContent=fmtM(working.cny+working.saving);
  $('saving').textContent=fmtM(working.saving);
  fit($('jpy'),7.55,5.15);
  fit($('cny'),7.55,5.05);
}
function read(){
  const j=Number(($('inJpy').value||'').replace(/,/g,''));
  const c=Number(($('inCny').value||'').replace(/,/g,''));
  const s=Number(($('inSaving').value||'').replace(/,/g,''));
  const d={jpy:Math.round(j),cny:round2(c),saving:round2(s)};
  return valid(d)?d:null;
}
function showDerived(){
  const d=read(), box=$('derived');
  box.classList.toggle('err',!d);
  if(!d){
    box.textContent='请输入有效数字。日元范围：1 ～ 4,000,000；节省金额必须大于 0。';
    return;
  }
  const deal=d.cny/d.jpy*100;
  const market=(d.cny+d.saving)/d.jpy*100;
  box.innerHTML='成交汇率（100日元） '+deal.toFixed(6)+'　市场价 '+fmtM(d.cny+d.saving)
    +'<br>市场汇率（100日元） '+market.toFixed(6);
}
function fill(d){
  $('inJpy').value=d.jpy;
  $('inCny').value=d.cny.toFixed(2);
  $('inSaving').value=d.saving.toFixed(2);
  showDerived();
}
function hideEditor(){
  if(document.activeElement) document.activeElement.blur();
  try{ if(window.Android && Android.hideKeyboard) Android.hideKeyboard(); }catch(e){}
  $('mask').classList.remove('open');
  setTimeout(render,220);
}
function openEditor(){
  fill(working);
  $('mask').classList.add('open');
}

['inJpy','inCny','inSaving'].forEach(id=>$(id).addEventListener('input',showDerived));
$('reset').onclick=()=>fill(DEF);
$('preview').onclick=()=>{
  const d=read();
  if(!d){showDerived();return;}
  working=d;
  hideEditor();
};
$('save').onclick=()=>{
  const d=read();
  if(!d){showDerived();return;}
  working=d;
  saved={...d};
  localStorage.setItem(KEY,JSON.stringify(saved));
  hideEditor();
};
$('mask').addEventListener('click',e=>{
  if(e.target===$('mask')) hideEditor();
});

let taps=0,t0=0,timer=0;
$('secret').addEventListener('click',()=>{
  const now=Date.now();
  if(!t0 || now-t0>3000){taps=1;t0=now;} else taps++;
  clearTimeout(timer);
  timer=setTimeout(()=>{taps=0;t0=0;},3200);
  if(taps>=5){
    taps=0;t0=0;clearTimeout(timer);
    openEditor();
  }
});
window.addEventListener('resize',()=>setTimeout(render,60));
render();
})();
</script>
</body>
</html>

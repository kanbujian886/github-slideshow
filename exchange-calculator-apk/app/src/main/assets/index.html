<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>汇率计算器</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f0f3f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input{font:inherit}
#screen{position:relative;width:100vw;height:100vh;overflow:hidden;background-color:#f0f3f8;background-image:url("template.webp");background-repeat:no-repeat;background-position:top center;background-size:100% 101.926%}
.cover{position:absolute;pointer-events:none}
.cover.jpy{left:67.0%;top:17.19%;width:28.4%;height:4.95%;background:#fff}
.cover.cny{left:59.24%;top:26.75%;width:36.1%;height:4.88%;background:#fff}
.cover.rate{left:59.38%;top:33.91%;width:26.9%;height:2.75%;background:#f4f6fa}
.amount{position:absolute;color:#303033;text-align:right;font-family:"AlipayNumber","Alibaba Sans 102","DIN Alternate","Helvetica Neue",Arial,sans-serif;font-weight:500;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.028em;pointer-events:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#jpy{right:6.5%;top:17.55%;width:41%;font-size:7.55vw}
#cny{right:6.5%;top:26.65%;width:48%;font-size:7.55vw}
.rate-dyn{position:absolute;right:13.6%;top:34.02%;height:2.7%;display:flex;align-items:center;justify-content:flex-end;gap:.16em;font-size:2.58vw;white-space:nowrap;color:#3a3c41;pointer-events:none}
#market{color:#777b84;text-decoration:line-through;text-decoration-thickness:1px}
#saving{color:#ef684d;font-weight:600}
.secret{position:absolute;right:8.6%;top:1.3%;width:15.2%;height:6.8%;border:0;background:transparent;padding:0}
.disclaimer{position:absolute;left:0;right:0;bottom:1.4%;text-align:center;color:#747981;font-size:10px;line-height:1;letter-spacing:.04em;pointer-events:none}
.mask{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(20,24,34,.42);z-index:100}
.mask.open{display:flex}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 36px rgba(0,0,0,.18)}
.handle{width:46px;height:6px;border-radius:99px;background:#d5d6dc;margin:0 auto 16px}
h2{font-size:24px;margin:0 0 22px;color:#111;font-weight:700}
.field{margin-bottom:18px}
.field label{display:block;margin-bottom:9px;font-size:16px;color:#6f7581}
.field input{width:100%;height:78px;border:1px solid #d8dadd;border-radius:22px;padding:0 22px;font-size:26px;outline:none;background:#fff;color:#111}
.field input:focus{border-color:#4b8fff;box-shadow:0 0 0 3px rgba(75,143,255,.10)}
.derived{display:none}
.actions{display:grid;grid-template-columns:1fr 1.25fr;gap:18px;margin-top:12px}
.actions button{height:86px;border:0;border-radius:22px;font-size:24px;font-weight:500}
.cancel{background:#eceef1;color:#52565d}
.save{background:#2a79ee;color:#fff}
.note{font-size:12px;color:#999fa8;line-height:1.6;margin-top:18px;padding:0 2px 4px}
.err{color:#d94d45!important}
</style>
</head>
<body>
<div id="screen">
  <div class="cover jpy"></div>
  <div class="cover cny"></div>
  <div class="cover rate"></div>
  <div id="jpy" class="amount"></div>
  <div id="cny" class="amount"></div>
  <div class="rate-dyn"><span id="market"></span><span>省</span><span id="saving"></span><span>元</span></div>
  <button id="secret" class="secret" aria-label="menu"></button>
  <div class="disclaimer">非官方</div>
</div>

<div id="mask" class="mask">
  <div class="sheet">
    <div class="handle"></div>
    <h2>编辑汇率</h2>
    <div class="field"><label>日元金额 JPY</label><input id="inJpy" inputmode="numeric"></div>
    <div class="field"><label>成交汇率（100日元 = 人民币）</label><input id="inDealRate" inputmode="decimal"></div>
    <div class="field"><label>人民币金额 CNY（修改后可反算成交汇率）</label><input id="inCny" inputmode="decimal"></div>
    <div class="field"><label>市场汇率（100日元 = 人民币）</label><input id="inMarketRate" inputmode="decimal"></div>
    <div id="derived" class="derived"></div>
    <div class="actions">
      <button id="cancel" class="cancel">取消</button>
      <button id="save" class="save">保存</button>
    </div>
    <div class="note">金额和汇率只保存在本机浏览器。修改日元金额、成交汇率或人民币金额会自动联动计算。</div>
  </div>
</div>

<script>
(()=>{
const KEY='exchange_demo_v5';
const DEF={jpy:852192,dealRate:4.3033,marketRate:4.3330};
let saved=load();
let working={...saved};
const $=id=>document.getElementById(id);
const fmtJ=n=>Math.round(n).toLocaleString('en-US');
const fmtM=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const trim4=n=>Number(n).toFixed(4).replace(/0+$/,'').replace(/\.$/,'');
const round2=n=>Math.round(n*100)/100;

function calcCny(d){return round2(d.jpy*d.dealRate/100)}
function calcMarket(d){return round2(d.jpy*d.marketRate/100)}
function calcSaving(d){return round2(calcMarket(d)-calcCny(d))}
function valid(d){
  return d && Number.isFinite(d.jpy) && d.jpy>=1 && d.jpy<=4000000
    && Number.isFinite(d.dealRate) && d.dealRate>0
    && Number.isFinite(d.marketRate) && d.marketRate>0
    && d.marketRate>=d.dealRate;
}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY)||'null');
    if(valid(x)) return x;
  }catch(e){}
  return {...DEF};
}
function fit(el,start,min){
  el.style.fontSize=start+'vw';
  let size=start;
  while(el.scrollWidth>el.clientWidth && size>min){
    size-=.12;
    el.style.fontSize=size+'vw';
  }
}
function render(){
  $('jpy').textContent=fmtJ(working.jpy);
  $('cny').textContent=fmtM(calcCny(working));
  $('market').textContent=fmtM(calcMarket(working));
  $('saving').textContent=fmtM(calcSaving(working));
  fit($('jpy'),7.55,5.15);
  fit($('cny'),7.55,5.05);
}
function n(v){return Number(String(v||'').replace(/,/g,'').trim())}
function fill(){
  $('inJpy').value=Math.round(working.jpy);
  $('inDealRate').value=trim4(working.dealRate);
  $('inCny').value=calcCny(working).toFixed(2);
  $('inMarketRate').value=trim4(working.marketRate);
}
function closeEditor(){
  if(document.activeElement) document.activeElement.blur();
  try{if(window.Android&&Android.hideKeyboard)Android.hideKeyboard()}catch(e){}
  $('mask').classList.remove('open');
  setTimeout(render,220);
}
function openEditor(){fill();$('mask').classList.add('open')}

let syncing=false;
$('inJpy').addEventListener('input',()=>{
  if(syncing)return;
  const j=n($('inJpy').value), r=n($('inDealRate').value);
  if(j>=1 && j<=4000000 && r>0){
    syncing=true;$('inCny').value=round2(j*r/100).toFixed(2);syncing=false;
  }
});
$('inDealRate').addEventListener('input',()=>{
  if(syncing)return;
  const j=n($('inJpy').value), r=n($('inDealRate').value);
  if(j>=1 && j<=4000000 && r>0){
    syncing=true;$('inCny').value=round2(j*r/100).toFixed(2);syncing=false;
  }
});
$('inCny').addEventListener('input',()=>{
  if(syncing)return;
  const j=n($('inJpy').value), c=n($('inCny').value);
  if(j>=1 && j<=4000000 && c>=0){
    syncing=true;$('inDealRate').value=trim4(c/j*100);syncing=false;
  }
});

$('cancel').onclick=()=>closeEditor();
$('save').onclick=()=>{
  const d={
    jpy:Math.round(n($('inJpy').value)),
    dealRate:n($('inDealRate').value),
    marketRate:n($('inMarketRate').value)
  };
  if(!valid(d))return;
  working=d;saved={...d};
  localStorage.setItem(KEY,JSON.stringify(saved));
  closeEditor();
};
$('mask').addEventListener('click',e=>{if(e.target===$('mask'))closeEditor()});

let taps=0,t0=0,timer=0;
$('secret').addEventListener('click',()=>{
  const now=Date.now();
  if(!t0||now-t0>3000){taps=1;t0=now}else taps++;
  clearTimeout(timer);
  timer=setTimeout(()=>{taps=0;t0=0},3200);
  if(taps>=5){taps=0;t0=0;clearTimeout(timer);openEditor()}
});
window.addEventListener('resize',()=>setTimeout(render,60));
render();
})();
</script>
</body>
</html>

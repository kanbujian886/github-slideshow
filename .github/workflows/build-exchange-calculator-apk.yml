name: Build Exchange Calculator APK

on:
  push:
    branches: [ exchange-calculator-apk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-calculator-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-calculator-apk
          path: exchange-calculator-apk/app/build/outputs/apk/debug/app-debug.apk
